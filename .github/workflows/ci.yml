name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: ビルドとテスト
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: テストと報告書の作成
        run: dotnet run scripts/TestReport.cs -- . artifacts/test-report

      - name: テスト仕様書が最新か確認
        run: |
          git diff --exit-code -- docs/test-spec.md
          if ($LASTEXITCODE -ne 0) {
            Write-Error "docs/test-spec.md is out of date. Run 'dotnet run scripts/TestReport.cs -- .' and commit the result."
            exit 1
          }

      - name: テスト報告書を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: artifacts/test-report/test-report.md
          if-no-files-found: ignore
          retention-days: 30

  package:
    name: 配布用 zip
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: zip の作成
        run: ./scripts/publish.ps1 -ZipOnly

      - name: zip を保存
        uses: actions/upload-artifact@v7
        with:
          name: RuleQA-win-x64
          path: artifacts/RuleQA/
          retention-days: 14
